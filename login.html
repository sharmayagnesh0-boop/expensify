<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expensify Login</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ===== PAGE BACKGROUND ===== */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a);
overflow:hidden;
}

/* Animated background glow */

.bg{
position:fixed;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

.bg span{
position:absolute;
width:600px;
height:600px;
border-radius:50%;
filter:blur(140px);
opacity:.6;
animation:float 18s infinite alternate ease-in-out;
}

.bg span:nth-child(1){
background:#2563eb;
top:-200px;
left:-200px;
}

.bg span:nth-child(2){
background:#9333ea;
bottom:-200px;
right:-200px;
animation-delay:5s;
}

@keyframes float{
from{transform:translate(0,0);}
to{transform:translate(80px,-80px);}
}

/* ===== LOGIN CARD ===== */

.login-box{
width:360px;
padding:45px;
border-radius:18px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
box-shadow:
0 20px 60px rgba(0,0,0,.6),
inset 0 0 0 1px rgba(255,255,255,.05);

text-align:center;
animation:fadeUp .7s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}

.logo{
font-size:26px;
font-weight:700;
margin-bottom:10px;
background:linear-gradient(90deg,#38bdf8,#9333ea);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
opacity:.7;
margin-bottom:30px;
}

/* INPUTS */

.login-box input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
outline:none;
}

.login-box input::placeholder{
color:#94a3b8;
}

/* BUTTON */

.login-box button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#38bdf8,#2563eb);
color:white;
font-weight:600;
cursor:pointer;
box-shadow:0 8px 25px rgba(0,0,0,.4);
transition:.3s;
}

.login-box button:hover{
transform:translateY(-3px);
}

#error{
margin-top:12px;
color:#ef4444;
}

/* FOOTER */

.footer{
margin-top:20px;
opacity:.6;
font-size:13px;
}

</style>

</head>

<body>

<!-- Background -->
<div class="bg">
<span></span>
<span></span>
</div>

<!-- Login Card -->
<div class="login-box">

<div class="logo">💰 Expensify</div>
<p class="subtitle">Welcome back — manage your finances smarter</p>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>

<div class="footer">
Modern Expense Tracker
</div>

</div>

<!-- Load Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 1. Initialize Supabase
  const SUPABASE_URL = 'https://YOUR-PROJECT-URL.supabase.co';
  const SUPABASE_KEY = 'YOUR-ANON-KEY';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Auto-redirect if already logged in
  window.onload = async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location = "index.html";
  };

  // 2. Sign Up Function
  async function signUp() {
    let email = document.getElementById("user").value.trim();
    let pass = document.getElementById("pass").value.trim();
    let errorEl = document.getElementById("error");

    errorEl.innerText = "Creating account...";
    errorEl.style.color = "#38bdf8";

    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: pass,
    });

    if (error) {
      errorEl.innerText = error.message;
      errorEl.style.color = "#ef4444";
    } else {
      errorEl.innerText = "Success! Logging you in...";
      setTimeout(() => window.location = "index.html", 1000);
    }
  }

  // 3. Login Function (Replaces your hardcoded admin check)
  async function login() {
    let email = document.getElementById("user").value.trim();
    let pass = document.getElementById("pass").value.trim();
    let errorEl = document.getElementById("error");

    errorEl.innerText = "Authenticating...";
    errorEl.style.color = "#38bdf8";

    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: pass,
    });

    if (error) {
      errorEl.innerText = "Invalid credentials. Try again.";
      errorEl.style.color = "#ef4444";
    } else {
      document.body.style.opacity = "0";
      setTimeout(() => window.location = "index.html", 400);
    }
  }
</script>
</body>
</html>
